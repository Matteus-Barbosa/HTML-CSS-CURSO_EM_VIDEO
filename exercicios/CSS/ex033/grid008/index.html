<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
        }

        .caixa{
            /*Espanção de elementos no grid*/ 
            grid-row-start: 1 ;
            grid-row-end: span 3; 
            grid-column-start: 1;
            grid-column-end: span 2;

            /*Shorthands (start/end)*/
            grid-row: 1 / 4;
            grid-column: 1 / 3;
                /*Com espanção*/
                grid-row: 1 / span 1; 
                grid-column: 1 / span 4;
            
            /*grid-area (row-start/column-start/row-end/column-end)*/
            grid-area: 1 / 1 / 4 / 3;
                /*Com espanção*/
                grid-area: 1 / 1 / span 1 / span 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
    </div>
</body>
</html>
