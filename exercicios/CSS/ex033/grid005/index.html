<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Layout</title>
    <style>
        div.container {
            border: 3px solid blue;
            height: 250px;

            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;
            
        }

        div.item {
            border: 3px dashed red;
            padding: 5px;
        }
        
        .função-repeat {
            grid-template-columns: repeat(3, auto);
            grid-template-rows: repeat(3, 100px);

            grid-template:
                repeat(3, 100px) / repeat(3, auto);
        }

        .unidade-fracional {
            width: 1500px; /*container*/
            grid-template-columns: 1fr 1fr 1fr; /*= 1500/3 = 500 = 1fr*/

            grid-template-columns: 1fr 2fr 1fr; /*= 1500/4 = 375 = 1fr*/

            /*Unidades Mistas*/
            grid-template-columns: 
            100px /*pixels absolutos*/
            20% /*do container*/
            /*1500-400 = 1100/2:*/
            repeat(2, 1fr); /*= 550 cada*/
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
