<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Layout</title>
    <style>
        div.container {
            border: 3px solid blue;
            height: 250px;

            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;
            
        }

        div.item {
            border: 3px dashed red;
            padding: 5px;
        }
        /*Determina o tamanho automatico de novas linhas e colunas*/
        .grid-auto-rows--grid-auto-columns { 
            grid-auto-rows: 100px;
            grid-auto-columns: 100px;
        }
        
        /*ShortHands*/
        .place-items--place-content {
            place-items: stretch center; /*align-items justify-items*/
            place-content: start end; /*align-content justify-content*/
        }

        .grid-template{
            grid-template: 100px 100px 100px / auto auto auto;
            /*template-rows / template-columns*/
        } 

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
