<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        @charset "UTF-8";
        
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-rows: 80px 40px 1fr 40px ;
            grid-template-columns: 1fr 150px;
            gap: 5px;
        }

        .top {
            background-color: red;
            grid-row: 1 / 1;
            grid-column: 1 / 3;
        }

        .menu {
            background-color: green;
            grid-row: 2 / 2;
            grid-column: 1 / 3;
        }

        .principal {
            background-color: yellow;
            grid-row: 3 / 3;
            grid-column: 1 / 2;
        }

        .secundario {
            background-color: blue;
            grid-row: 3/3;
            grid-column: 2/3;
        }

        .rodape {
            background-color: darkorange;
            grid-row: 4/4;
            grid-column: 1/3;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="top"></div>
        <div class="menu"></div>
        <div class="principal"></div>
        <div class="secundario"></div>
        <div class="rodape"></div>
    </div>
</body>
</html>
